name: txn-platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: txn-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-txn_platform}
      POSTGRES_USER: ${POSTGRES_USER:-txn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: txn-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-txn_platform}
      DB_USER: ${POSTGRES_USER:-txn_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  pgdata: